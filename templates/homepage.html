<!DOCTYPE html>
<html>
<head>
    <title>CS3240 Project</title>
    <style>

        body{
            font-family: "PT Sans";
            background-color:#C4D8E2;
            margin: 0;
        }

        h1{
            font-size: 25px;
            text-align: center;
        }

        nav{
            background-color: #4682B4;
            color: white;
            overflow: hidden;
            padding: 10px;
        }
        nav a {
            color: white;
            text-align: center;
            font-weight: bold;
            padding: 10px;
        }

        nav a:hover{
            background-color: chocolate;
        }

        nav a.active{
            background-color: aqua;
            color: white;
        }
        .info{
            text-align: center;
            padding: 30px;
        }
    </style>
</head>
<body>



{% if user.is_authenticated %}
<nav>
    <a href="/">Home</a>
    <a href="/accounts/logout/">Logout</a>
    <a href="/profile/">Profile</a>
</nav>
    <p>Welcome {{ user.email }}</p>

{% else %}
    <h1>Django is running on Heroku 🚀</h1>
    <a href="/accounts/google/login/">Sign in with Google</a>
{% endif %}

</body>
</html>
