{% extends "base.html" %}
{% load socialaccount %}

{% block title %}Google Login{% endblock %}

{% block content %}
<div class="form-box center-text">
    <h2>Login with Google</h2>
    <p>You are about to sign in using your Google account.</p>

    <form method="post">
        {% csrf_token %}
        <button class="google-btn" type="submit">Continue with Google</button>
    </form>

    <div class="auth-links">
        <a href="{% url 'account_login' %}">Back to regular sign in</a>
    </div>
</div>
{% endblock %}
